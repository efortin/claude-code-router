version: '3'

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  build:
    desc: Build the project
    sources:
      - src/**/*.ts
      - tsconfig.json
    generates:
      - dist/**/*
    cmds:
      - pnpm install
      - node scripts/build.js

  lint:
    desc: Run ESLint and Prettier checks
    cmds:
      - pnpm install
      - pnpm run lint
      - pnpm prettier --check "src/**/*.ts" "tests/**/*.ts"

  fix:
    desc: Auto-fix linting issues
    cmds:
      - pnpm install
      - pnpm run lint:fix
      - pnpm prettier --write "src/**/*.ts" "tests/**/*.ts"

  test:
    desc: Run tests with coverage
    cmds:
      - pnpm install
      - pnpm run test:coverage

  test:coverage:
    desc: Run tests with coverage report
    cmds:
      - pnpm install
      - pnpm run test:coverage

  typecheck:
    desc: Run TypeScript type checking
    cmds:
      - pnpm install
      - pnpm tsc --noEmit

  dev:
    desc: Run in development mode
    cmds:
      - task: build
      - node dist/cli.js start

  push:
    desc: Validate and push to git
    cmds:
      - task: lint
      - task: test
      - git push
    preconditions:
      - sh: git diff-index --quiet HEAD --
        msg: "You have uncommitted changes. Please commit or stash them first."

  release:
    desc: Build and publish to npm
    cmds:
      - task: lint
      - task: test
      - task: build
      - pnpm publish
    preconditions:
      - sh: git diff-index --quiet HEAD --
        msg: "You have uncommitted changes. Please commit or stash them first."

  # Docker build and push
  docker:
    desc: Build and push Docker image to registry
    cmds:
      - docker buildx build --platform linux/amd64 -t registry.sir-alfred.io/claude-code-router:latest --push .

  # Full deployment workflow
  deploy:
    desc: Full deployment (build, push, deploy to k8s)
    cmds:
      - task: docker
      - kubectl --context home rollout restart deployment/claude-code-router -n anthropic
      - echo "Waiting for deployment to stabilize..."
      - sleep 15
      - kubectl --context home get pods,svc,ingress -n anthropic
      - kubectl --context home rollout status deployment/claude-code-router -n anthropic
      - echo "Health check:"
      - curl -s https://anthropic.sir-alfred.io/health | jq

  # K3d tasks for CI/local testing
  k3d:install:
    desc: Install k3d if not present
    internal: true
    status:
      - command -v k3d
    cmds:
      - echo "Installing k3d..."
      - curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash

  k3d:create:
    desc: Create k3d cluster
    deps: [k3d:install]
    status:
      - k3d cluster list | grep -q "ccr-test"
    cmds:
      - echo "Creating k3d cluster..."
      - k3d cluster create ccr-test --agents 1 --wait --timeout 2m
      - kubectl cluster-info --context k3d-ccr-test
      - kubectl get nodes --context k3d-ccr-test

  k3d:deploy:
    desc: Deploy to k3d cluster
    deps: [k3d:create]
    cmds:
      - |
        # Use K3D_IMAGE env var if set, otherwise default to local image
        IMAGE_NAME="${K3D_IMAGE:-registry.sir-alfred.io/claude-code-router:latest}"
        echo "Loading Docker image ${IMAGE_NAME} into k3d..."

        # Try k3d image import first
        if ! k3d image import ${IMAGE_NAME} -c ccr-test 2>/dev/null; then
          echo "k3d image import failed, trying manual save/load method..."
          # Manual method: save to tarball and load into nodes
          docker save ${IMAGE_NAME} -o /tmp/ccr-image.tar
          docker exec k3d-ccr-test-server-0 ctr images import /tmp/ccr-image.tar || \
            (docker cp /tmp/ccr-image.tar k3d-ccr-test-server-0:/tmp/ccr-image.tar && \
             docker exec k3d-ccr-test-server-0 ctr images import /tmp/ccr-image.tar)
          docker exec k3d-ccr-test-agent-0 ctr images import /tmp/ccr-image.tar || \
            (docker cp /tmp/ccr-image.tar k3d-ccr-test-agent-0:/tmp/ccr-image.tar && \
             docker exec k3d-ccr-test-agent-0 ctr images import /tmp/ccr-image.tar)
          rm -f /tmp/ccr-image.tar
        fi
      - kubectl --context k3d-ccr-test apply -f deployments/k8s/namespace.yml
      - kubectl --context k3d-ccr-test apply -f deployments/k8s/configmap.yml
      - kubectl --context k3d-ccr-test apply -f deployments/k8s/deployment.yml
      - |
        # Use K3D_IMAGE env var if set, otherwise default to local image
        IMAGE_NAME="${K3D_IMAGE:-registry.sir-alfred.io/claude-code-router:latest}"
        echo "Patching image and imagePullPolicy for k3d..."
        kubectl --context k3d-ccr-test patch deployment claude-code-router -n anthropic -p "{\"spec\":{\"template\":{\"spec\":{\"containers\":[{\"name\":\"ccr\",\"image\":\"${IMAGE_NAME}\",\"imagePullPolicy\":\"IfNotPresent\"}]}}}}"
      - echo "Waiting for deployment..."
      - kubectl --context k3d-ccr-test wait --for=condition=available --timeout=120s deployment/claude-code-router -n anthropic

  k3d:verify:
    desc: Verify k3d deployment
    deps: [k3d:deploy]
    cmds:
      - echo "Checking pod status..."
      - kubectl --context k3d-ccr-test get pods,svc -n anthropic
      - echo "Checking pod logs..."
      - kubectl --context k3d-ccr-test logs -n anthropic deployment/claude-code-router --tail=20
      - echo "Testing health endpoint via port-forward..."
      - |
        kubectl --context k3d-ccr-test port-forward -n anthropic deployment/claude-code-router 3456:3456 > /dev/null 2>&1 &
        PF_PID=$!
        echo "Waiting for port-forward to be ready..."
        sleep 3

        # Retry health check up to 10 times with 1 second between attempts
        SUCCESS=false
        for i in {1..10}; do
          if curl -sf http://localhost:3456/health > /dev/null 2>&1; then
            SUCCESS=true
            break
          fi
          echo "Health check attempt $i/10 failed, retrying..."
          sleep 1
        done

        if [ "$SUCCESS" = "true" ]; then
          echo "Health check passed"
          kill $PF_PID 2>/dev/null || true
        else
          echo "Health check failed after 10 attempts"
          kill $PF_PID 2>/dev/null || true
          exit 1
        fi

  k3d:test:
    desc: Run k3d integration tests
    deps: [k3d:verify]
    cmds:
      - echo "All k3d tests passed"

  k3d:teardown:
    desc: Delete k3d cluster
    cmds:
      - k3d cluster delete ccr-test || true
      - echo "k3d cluster deleted"

  k3d:setup:
    desc: Setup k3d cluster for testing
    cmds:
      - task: k3d:create
      - task: k3d:deploy
