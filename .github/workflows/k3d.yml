name: K3d Integration Tests

on:
  push:
    branches: [ main, chore/cleanup-fork ]
  pull_request:
    branches: [ main ]

jobs:
  k3d-integration:
    name: K3d Deployment Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'pnpm'

      - name: Install Task
        run: |
          sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b ~/.local/bin
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: task build

      - name: Build Docker image
        run: docker build -t registry.sir-alfred.io/claude-code-router:latest .

      - name: Install k3d
        run: curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash

      - name: Create k3d cluster
        run: task k3d:create

      - name: Deploy to k3d
        run: task k3d:deploy

      - name: Verify deployment
        run: task k3d:verify

      - name: Run integration tests
        run: task k3d:test

      - name: Cleanup k3d cluster
        if: always()
        run: task k3d:teardown
