version: '3'

# K3d tasks for CI/local testing
tasks:
  install:
    desc: Install k3d if not present
    internal: true
    status:
      - command -v k3d
    cmds:
      - echo "Installing k3d..."
      - curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash

  registry:create:
    desc: Create k3d registry
    internal: true
    status:
      - k3d registry list | grep -q "k3d-ccr-registry"
    cmds:
      - echo "Creating k3d registry..."
      - k3d registry create ccr-registry --port 5555
      - echo "Registry created at localhost:5555"

  create:
    desc: Create k3d cluster with registry
    deps: [install, registry:create]
    status:
      - k3d cluster list | grep -q "ccr-test"
    cmds:
      - echo "Creating k3d cluster..."
      - k3d cluster create ccr-test --servers 1 --agents 0 --registry-use k3d-ccr-registry:5555 --wait
      - kubectl cluster-info --context k3d-ccr-test
      - kubectl get nodes --context k3d-ccr-test

  deploy:
    desc: Deploy to k3d cluster
    deps: [create]
    cmds:
      - |
        SOURCE_IMAGE="${K3D_IMAGE:-registry.sir-alfred.io/claude-code-router:latest}"
        REGISTRY_IMAGE="localhost:5555/claude-code-router:test"

        echo "Pushing ${SOURCE_IMAGE} to k3d registry..."
        docker tag ${SOURCE_IMAGE} ${REGISTRY_IMAGE}
        docker push ${REGISTRY_IMAGE}
        echo "Image pushed to registry"
      - kubectl --context k3d-ccr-test apply -f deployments/k8s/namespace.yml
      - kubectl --context k3d-ccr-test apply -f deployments/k8s/configmap.yml
      - kubectl --context k3d-ccr-test apply -f deployments/k8s/deployment.yml
      - |
        REGISTRY_IMAGE="k3d-ccr-registry:5555/claude-code-router:test"
        echo "Patching deployment to use registry image..."
        kubectl --context k3d-ccr-test patch deployment claude-code-router -n anthropic -p "{\"spec\":{\"template\":{\"spec\":{\"containers\":[{\"name\":\"ccr\",\"image\":\"${REGISTRY_IMAGE}\",\"imagePullPolicy\":\"Always\"}]}}}}"
      - echo "Waiting for deployment..."
      - kubectl --context k3d-ccr-test wait --for=condition=available --timeout=120s deployment/claude-code-router -n anthropic

  verify:
    desc: Verify k3d deployment
    deps: [deploy]
    cmds:
      - echo "Checking deployment status..."
      - kubectl --context k3d-ccr-test get pods,svc -n anthropic
      - kubectl --context k3d-ccr-test logs -n anthropic deployment/claude-code-router --tail=20
      - echo "Testing health endpoint..."
      - |
        kubectl --context k3d-ccr-test port-forward -n anthropic deployment/claude-code-router 3456:3456 > /dev/null 2>&1 &
        PF_PID=$!
        sleep 5
        curl -sf http://localhost:3456/health && echo "Health check passed" || exit 1
        kill $PF_PID 2>/dev/null || true

  test:
    desc: Run k3d integration tests
    deps: [verify]
    cmds:
      - echo "All k3d tests passed"

  teardown:
    desc: Delete k3d cluster and registry
    cmds:
      - k3d cluster delete ccr-test || true
      - k3d registry delete k3d-ccr-registry || true
      - echo "k3d cluster and registry deleted"

  setup:
    desc: Setup k3d cluster for testing
    cmds:
      - task: create
      - task: deploy
